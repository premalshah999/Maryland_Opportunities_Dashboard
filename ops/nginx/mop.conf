# Nginx site config for mop.rhsmith.umd.edu

server {
  listen 80;
  listen [::]:80;
  server_name mop.rhsmith.umd.edu;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name mop.rhsmith.umd.edu;

  ssl_certificate     /etc/ssl/mop.crt;
  ssl_certificate_key /etc/ssl/mop.key;

  # Static frontend build
  root /opt/mop/app/frontend/dist;
  index index.html;

  # Reasonable limits for Excel downloads
  client_max_body_size 50m;

  # Security headers (safe defaults)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API reverse proxy
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Static asset caching (Vite fingerprints assets)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}

